# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test

on:
  push:
    branches: [ master, V4_Final ]
  pull_request:
    branches: [ master, V4_Final ]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.10.0]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Install and run lint
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: NPQ_PKG_MGR=yarn npx npq install
    - run: yarn lint

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.10.0]
        test-script: ["ci:test-unit", "ci:test-e2e-layouts","ci:test-e2e-styleParams", "ci:test-e2e-integration"]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Install, build and run test
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - run: NPQ_PKG_MGR=yarn npx npq install
    - run: yarn build
    - run: yarn ${{ matrix.test-script }}
      env:
        SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        TEST_NAME: ${{ matrix.test-script }}

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, tests]
    strategy:
      matrix:
        node-version: [22.10.0]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        token: ${{ secrets.PAT_TOKEN }}
        fetch-depth: 0
    - name: Install, build, configure git and lerna publish
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        registry-url: 'https://registry.npmjs.org'
    - run: NPQ_PKG_MGR=yarn npx npq install
    - run: git checkout -- package.json
    - run: yarn build --if-present
    - run: |
        git config --global user.email "octocat@github.com"
        git config --global user.name "GitHub Actions"
        git remote set-url origin https://wix@github.com/wix/pro-gallery
        echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
    - name: Push to master
      if: github.event_name == 'push'
      run: |
        git checkout ${{ github.ref_name }}
        lerna publish patch --exact  --yes --dist-tag stable --registry https://registry.npmjs.org
        yarn changelog
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
    - name: Push to pull request
      if: github.event_name == 'pull_request' && github.actor != 'dependabot' 
      run: lerna publish --canary --preid ${{ github.sha }} --yes --registry https://registry.npmjs.org
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  update-playground:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [lint, tests]
    strategy:
      matrix:
        node-version: [22.10.0]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: update-playground
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        registry-url: 'https://registry.npmjs.org'
    - run: NPQ_PKG_MGR=yarn npx npq install
    - run: yarn build --if-present
    - run: node scripts/deployToSurge
      env:
        SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}